[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-copilot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.151.1",
    "fastapi>=0.165.0",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
